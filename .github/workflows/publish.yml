name: Publish to PyPI

# Trigger this workflow when a GitHub release is published
on:
  release:
    types: [published]

# Required permissions for trusted publishing
permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing to PyPI

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build distribution packages
        run: python -m build

      - name: Verify distribution packages
        run: twine check dist/*

      - name: List distribution contents
        run: |
          echo "::group::Built distribution files"
          ls -lh dist/
          echo "::endgroup::"
          echo "::group::Source distribution contents"
          tar -tzf dist/*.tar.gz | head -20
          echo "::endgroup::"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Optional: Use a deployment environment for additional protection
    # Uncomment the next two lines after creating a 'pypi' environment in repository settings
    # environment:
    #   name: pypi

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # This action uses PyPI Trusted Publishing (OIDC)
        # No API tokens or secrets are required in GitHub
        #
        # REQUIRED SETUP (one-time):
        # 1. Go to https://pypi.org/manage/account/publishing/
        # 2. Add a "pending publisher" with these details:
        #    - Owner: NGEE-Arctic
        #    - Repository name: elm-diagnostics
        #    - Workflow name: publish.yml
        #    - Environment name: pypi (if using deployment environment above)
        # 3. The first successful publish will activate the trusted publisher
        #
        # For more information, see:
        # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
