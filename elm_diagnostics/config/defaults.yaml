# elm-diagnostics default configuration
# Variable names verified against E3SM ELM source (Phase 0 reconnaissance)

report:
  title_template: "ELM diagnostics — {casename}"
  output_formats: [png, netcdf]
  
  thumbnails:
    enabled: true
    size: [400, 300]  # pixels
    dpi: 72
  
  plot_types:
    include: [timeseries, hovmuller, seasonal, anomaly, histogram, diurnal]
  
  variable_sections:
    max_variables_per_group: 10
    show_statistics_table: true
  
  balance_sections:
    show_statistics_table: true
    show_residual_percentage: true
  
  comparison:
    show_delta_plots: true
    side_by_side_layout: true
  
  metadata:
    show_configuration: true
    show_run_info: true
    show_generation_timestamp: true

plots:
  style:
    figsize: [8, 5]
    dpi: 150
    palette: "tab10"
  climatology:
    include_climos: true
    climo_start_year: -1  # -1 means earliest available year
    climo_end_year: -1    # -1 means latest available year
    envelope: "minmax"  # or "p10_p90", "std"

io:
  strict_combine: false
  chunk_mode: auto      # off | auto | manual
  chunk_target_mb: 64   # target chunk size budget for auto mode
  chunks: {}            # manual mode, e.g. {time: 240}

time:
  water_year_start_month: 10
  cumulative_years: "all"  # or list of ints, or "each"

variables:
  groups:
    hydrology: [H2OSOI, QRUNOFF, QDRAI, SNOWDP, H2OSNO, H2OSFC,
                SOILLIQ, SOILICE, QOVER, QINFL, QSNOMELT]
    carbon_pools: [LEAFC, LIVESTEMC, DEADSTEMC, FROOTC, LIVECROOTC,
                   DEADCROOTC, TOTSOMC, TOTLITC, CWDC, TOTECOSYSC, TOTCOLC]
    carbon_fluxes: [GPP, AR, HR, ER, NEE, NBP, TOTFIRE, WOOD_HARVESTC,
                    LITHR, SOMHR]
    energy: [FSDS, FSR, FLDS, FIRE, FSA, FIRA, FSH, EFLX_LH_TOT, FGR,
             SABV, SABG]
    soil_state: [TSOI, SOILLIQ, SOILICE]
    vegetation: [TLAI, TSAI, HTOP, GPP, TOTVEGC]
