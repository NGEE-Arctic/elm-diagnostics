# elm-diagnostics default configuration
# Variable names verified against E3SM ELM source (Phase 0 reconnaissance)

report:
  title_template: "ELM diagnostics — {casename}"
  output_formats: [png, netcdf]
  
  thumbnails:
    enabled: true
    size: [400, 300]  # pixels
    dpi: 72
  
  plot_types:
    include: [timeseries, seasonal, anomaly, histogram, diurnal]
  
  variable_sections:
    max_variables_per_group: 10
    show_statistics_table: true
  
  balance_sections:
    show_statistics_table: true
    show_residual_percentage: true
  
  comparison:
    show_delta_plots: true
    side_by_side_layout: true
  
  metadata:
    show_configuration: true
    show_run_info: true
    show_generation_timestamp: true

plots:
  style:
    figsize: [8, 5]
    dpi: 150
    palette: "tab10"
  climatology:
    include_climos: true
    climo_start_year: -1  # -1 means earliest available year
    climo_end_year: -1    # -1 means latest available year
    envelope: "minmax"  # or "p10_p90", "std"

io:
  strict_combine: false
  chunk_mode: auto      # off | auto | manual
  chunk_target_mb: 64   # target chunk size budget for auto mode
  chunks: {}            # manual mode, e.g. {time: 240}

time:
  water_year_start_month: 10
  cumulative_years: "all"  # or list of ints, or "each"

balances:
  water:
    storages: [SOILLIQ, SOILICE, H2OSNO, H2OCAN, H2OSFC]
    optional_storages: [WA]
    inputs: [RAIN, SNOW]
    # Total ET computed from: QSOIL + QVEGE + QVEGT if QFLX_EVAP_TOT not available
    # QFLX_SUB_SNOW is part of QSOIL (ground evap includes sublimation)
    outputs: [QFLX_EVAP_TOT, QOVER, QDRAI, QDRAI_PERCH]
    # Prefer detailed ELM runoff partitions when all are available.
    detailed_outputs: [QFLX_EVAP_TOT, QFLX_ROFLIQ_QSUR, QFLX_ROFLIQ_QSURP,
              QFLX_ROFLIQ_QSUB, QFLX_ROFLIQ_QSUBP, QFLX_ROFLIQ_QGWL,
              QFLX_ROFICE]
    use_detailed_outputs_when_available: true
    # Decomposition panel shows ET components separately:
    et_components: [QSOIL, QVEGE, QVEGT]  # Ground evap, canopy evap, transpiration
    # Optional model-computed residual diagnostics from history output
    model_residual_candidates: [ERRH2O]
    # Optional snow-specific imbalance diagnostics for context
    snow_residual_candidates: [ERRH2OSNO]
    # How to compare model residual to Python residual: auto | direct | cumulative
    model_residual_compare_mode: auto
    # Multiply model residual by this factor before comparison (use -1 if needed)
    model_residual_sign: 1.0
    residual_against: "dS/dt"
    frame: "water_year"

  carbon:
    mode: "auto"  # auto-detect BGC vs SP
    pools: [LEAFC, LIVESTEMC, DEADSTEMC, FROOTC, LIVECROOTC, DEADCROOTC,
            TOTSOMC, TOTLITC, CWDC]
    fluxes: [GPP, AR, HR, ER, NEE, TOTFIRE, WOOD_HARVESTC]
    ch4:
      aerenchyma: [CH4_SURF_AERE_SAT, CH4_SURF_AERE_UNSAT]
      diffusion: [CH4_SURF_DIFF_SAT, CH4_SURF_DIFF_UNSAT]
      ebullition: [CH4_SURF_EBUL_SAT, CH4_SURF_EBUL_UNSAT]
    residual_against: "TOTECOSYSC"
    frame: "calendar"

  energy:
    radiation: [FSDS, FSR, FLDS, FIRE, FSA, FIRA]
    turbulent: [FSH, EFLX_LH_TOT]
    ground: [FGR, FGR12]
    # Storage terms: HC (soil+snow), HCSOI (soil only) - NOT in default h0, must request
    # These are state variables (MJ/m2), need dHC/dt for flux equivalent
    storage: [HC, HCSOI]
    errors: [ERRSOI, ERRSEB]  # Energy balance error diagnostics
    frame: "calendar"
    cumulative: false

variables:
  groups:
    hydrology: [H2OSOI, QRUNOFF, QDRAI, SNOWDP, H2OSNO, H2OSFC,
                SOILLIQ, SOILICE, QOVER, QINFL, QSNOMELT]
    carbon_pools: [LEAFC, LIVESTEMC, DEADSTEMC, FROOTC, LIVECROOTC,
                   DEADCROOTC, TOTSOMC, TOTLITC, CWDC, TOTECOSYSC, TOTCOLC]
    carbon_fluxes: [GPP, AR, HR, ER, NEE, NBP, TOTFIRE, WOOD_HARVESTC,
                    LITHR, SOMHR]
    energy: [FSDS, FSR, FLDS, FIRE, FSA, FIRA, FSH, EFLX_LH_TOT, FGR,
             SABV, SABG]
    soil_state: [TSOI, SOILLIQ, SOILICE]
    vegetation: [TLAI, TSAI, HTOP, GPP, TOTVEGC]
