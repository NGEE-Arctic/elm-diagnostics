[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elm-diagnostics"
version = "0.2.0"
description = "Diagnostics and budget-closure tools for E3SM's ELM land model"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Rich Fiorella" },
    { name = "Matthew Hoffman" },
]
dependencies = [
    "xarray>=2023.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "netcdf4>=1.6",
    "cftime>=1.6",
    "pyyaml>=6.0",
    "pint>=0.22",
    "pint-xarray>=0.3",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dask = ["dask[complete]"]
interactive = ["plotly"]
maps = ["cartopy"]
all = ["elm-diagnostics[dask,interactive,maps]"]
dev = [
    "pytest>=7.0",
    "pytest-mpl>=0.16",
    "dask[complete]",
    "ruff==0.16.5",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
]

[project.scripts]
elm-diagnostics = "elm_diagnostics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["elm_diagnostics"]

# workspace/ holds local, in-progress analyses and must never ship in a release.
[tool.hatch.build.targets.sdist]
exclude = ["/workspace"]

[tool.mypy]
files = ["elm_diagnostics"]
ignore_missing_imports = true

# Baseline: these modules still had errors when mypy was introduced (88 in
# total, several reflecting real issues logged in REFACTOR_NOTES.md). Remove a
# module from this list once it type-checks cleanly; new modules are checked.
[[tool.mypy.overrides]]
module = [
    "elm_diagnostics.balances.carbon",
    "elm_diagnostics.balances.water",
    "elm_diagnostics.cli",
    "elm_diagnostics.io.run",
    "elm_diagnostics.io.units",
    "elm_diagnostics.plots.anomaly",
    "elm_diagnostics.plots.dimension_helpers",
    "elm_diagnostics.plots.diurnal",
    "elm_diagnostics.plots.histogram",
    "elm_diagnostics.plots.hovmuller",
    "elm_diagnostics.plots.seasonal",
    "elm_diagnostics.plots.timeseries",
    "elm_diagnostics.report.build",
    "elm_diagnostics.time.calendars",
    "elm_diagnostics.time.integration",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linting is pinned to ruff 0.16.5 (see [project.optional-dependencies].dev and
# .github/workflows/lint.yml) so `ruff check` locally matches CI exactly.
[tool.ruff]
line-length = 88
target-version = "py310"

# ruff 0.16.5's curated default rule set is enforced, minus three rules that
# clash with intentional patterns in this codebase:
#   BLE001 - blind `except Exception:` is used deliberately for report-generation
#            resilience (one failing section must not abort the whole report)
#   DTZ005 - report "generated at" timestamps use local naive time by design
#   TRY004 - config validation raises ValueError intentionally
[tool.ruff.lint]
ignore = ["BLE001", "DTZ005", "TRY004"]
